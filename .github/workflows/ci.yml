name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            spikes/aeneas-stream/subset
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (unit + end to end over loopback UDP and multicast)
        run: cargo test --workspace
      - name: Perf smoke test (no loss at 10k msg/s; latency not judged on shared runners)
        run: |
          cargo build --release --bin loadgen
          ./target/release/loadgen --feed 127.0.0.1:17201 --rate 10000 --duration 2 --warmup 1
      - name: Aeneas spike crate (unit + differential tests)
        working-directory: spikes/aeneas-stream/subset
        run: cargo test --workspace

  tla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Fetch TLC
        run: |
          mkdir -p "$RUNNER_TEMP/tla"
          curl -sSfL -o "$RUNNER_TEMP/tla/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          echo "TLA2TOOLS=$RUNNER_TEMP/tla/tla2tools.jar" >> "$GITHUB_ENV"
      - name: Model-check (CI bounds)
        run: spec/tla/check.sh
      - uses: dtolnay/rust-toolchain@stable
      - name: Trace validation (krusty-raft against RaftKC, 3 traces)
        run: |
          KRUSTY_RAFT_TRACE_DIR="$RUNNER_TEMP/traces" KRUSTY_RAFT_TRACE_SEEDS=3 \
            cargo test -q -p krusty-raft --test trace -- --ignored
          spec/tla/check-traces.sh "$RUNNER_TEMP/traces"

  verus:
    runs-on: ubuntu-latest
    env:
      # Keep in step with spikes/verus-ring/REPORT.md and its Cargo.toml pins.
      VERUS_RELEASE: 0.2026.11.02.8bf68ee
    steps:
      - uses: actions/checkout@v5
      - name: Install Verus and its toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R verus-lang/verus "release/$VERUS_RELEASE" \
            -p '*x86-linux.zip' -D "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP"/verus-*-x86-linux.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/verus-x86-linux" >> "$GITHUB_PATH"
          rustup install "$(jq -r .verus.toolchain "$RUNNER_TEMP/verus-x86-linux/version.json" | cut -d' ' -f1)" --profile minimal
      - name: Verify
        working-directory: spikes/verus-ring
        run: cargo verus verify
      - name: Test the erased code (stable)
        working-directory: spikes/verus-ring
        run: cargo test --release
      - name: Miri on the erased code (4 scheduling seeds)
        working-directory: spikes/verus-ring
        run: |
          rustup toolchain install nightly --profile minimal -c miri -c rust-src
          MIRIFLAGS="-Zmiri-many-seeds=0..4" cargo +nightly miri test
      - name: Miri on krusty-ring (the node's unsafe; 4 scheduling seeds)
        run: MIRIFLAGS="-Zmiri-many-seeds=0..4" cargo +nightly miri test -p krusty-ring

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          curl -sSfL https://github.com/cargo-bins/cargo-binstall/releases/latest/download/cargo-binstall-x86_64-unknown-linux-musl.tgz \
            | tar -xz -C ~/.cargo/bin
          cargo binstall -y cargo-fuzz
      - name: Fuzz the wire decoders (60 s)
        working-directory: crates/krusty-wire
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu decode -- -max_total_time=60
