name: nightly

# Long-running checks. The repository is private, so Actions minutes count:
# the simulation sweep is sized to a few minutes; the large TLA+ models run
# only on demand.

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      tla_large:
        description: "Also run the large TLA+ configurations (hours)"
        type: boolean
        default: false

jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Simulation sweep (new seeds every night)
        run: |
          cargo build --release -p krusty-sim
          # A different 20 000-seed window each day; failures print their seed.
          base=$(( $(date +%s) / 86400 * 20000 ))
          for s in default lossy short-retention contention eviction; do
            ./target/release/krusty-sim --scenario $s --seeds "$base..$((base + 20000))"
          done
          # Cluster runs (Raft, failover) are ~100x slower: fewer seeds.
          cbase=$(( $(date +%s) / 86400 * 1000 ))
          for s in cluster3 cluster5 cluster3-harsh cluster3-b; do
            ./target/release/krusty-sim --scenario $s --seeds "$cbase..$((cbase + 1000))"
          done
      - name: Raft cluster sweep (harsh faults, new seeds every night)
        run: |
          base=$(( $(date +%s) / 86400 * 20000 ))
          KRUSTY_RAFT_SEEDS=20000 KRUSTY_RAFT_BASE=$base cargo test --release -p krusty-raft --test cluster harsh_sweep -- --ignored
      - name: Trace validation (20 new traces every night, ~4 min of TLC)
        run: |
          mkdir -p "$RUNNER_TEMP/tla"
          curl -sSfL -o "$RUNNER_TEMP/tla/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          base=$(( $(date +%s) / 86400 * 20 ))
          KRUSTY_RAFT_TRACE_DIR="$RUNNER_TEMP/traces" KRUSTY_RAFT_TRACE_SEEDS=20 KRUSTY_RAFT_TRACE_BASE=$base \
            cargo test -q --release -p krusty-raft --test trace -- --ignored
          TLA2TOOLS="$RUNNER_TEMP/tla/tla2tools.jar" spec/tla/check-traces.sh "$RUNNER_TEMP/traces"
      - name: Node failover smoke (3 nodes over loopback, 20 leader stops)
        run: FAILOVER_MAX_MS=1000 cargo run --release -p krusty-client --example failover -- 20

  tla-large:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.tla_large }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Fetch TLC
        run: |
          mkdir -p "$RUNNER_TEMP/tla"
          curl -sSfL -o "$RUNNER_TEMP/tla/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          echo "TLA2TOOLS=$RUNNER_TEMP/tla/tla2tools.jar" >> "$GITHUB_ENV"
      - name: Model-check (large bounds)
        run: spec/tla/check.sh --large
