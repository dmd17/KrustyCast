# Aeron Cluster baseline (gap E3): three nodes and the load client on one
# host over loopback, from aeron-io/benchmarks' cluster_localhost sample.
aeron.cluster.members=0,localhost:20000,localhost:20001,localhost:20002,localhost:20003,localhost:20004|\
 1,localhost:21000,localhost:21001,localhost:21002,localhost:21003,localhost:21004|\
 2,localhost:22000,localhost:22001,localhost:22002,localhost:22003,localhost:22004
aeron.cluster.replication.channel=aeron:udp?endpoint=localhost:0
aeron.cluster.ingress.channel=aeron:udp
aeron.cluster.ingress.endpoints=0=localhost:20000,1=localhost:21000,2=localhost:22000
aeron.archive.recording.events.enabled=false
aeron.archive.replication.channel=aeron:udp?endpoint=localhost:0

# Node 0 leads, as node 1 does in krusty-load's cluster runs, so each
# node's threads can be laid out for its role (run.sh).
aeron.cluster.appointed.leader.id=0

# Followers' and the client's media drivers: one spinning thread. The
# leader's runs DEDICATED (node0.properties): a single shared thread cannot
# drain the leader's consensus socket at 50 000 msg/s and above.
aeron.threading.mode=SHARED
aeron.shared.idle.strategy=spin
aeron.archive.threading.mode=SHARED
aeron.archive.idle.strategy=spin

# Like KrustyCast mode (a): replicated before commit, no fsync on the
# latency path (also the low-latency profile's setting).
aeron.archive.file.sync.level=0

# 64-byte messages, as krusty-load's default payload.
io.aeron.benchmarks.message.length=64

# Results (client) and logs (nodes).
io.aeron.benchmarks.output.directory=/var/tmp/krusty-aeron-bench/results
