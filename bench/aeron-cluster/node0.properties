aeron.dir=/dev/shm/kb-aeron-node0
aeron.cluster.member.id=0
aeron.archive.control.channel=aeron:udp?endpoint=localhost:20004

# The leader's media driver: dedicated sender and receiver threads, each on
# a CPU of its own; the conductor (off the data path) backs off and runs on
# the housekeeping CPUs.
aeron.threading.mode=DEDICATED
aeron.sender.idle.strategy=noop
aeron.receiver.idle.strategy=noop
aeron.conductor.idle.strategy=backoff
