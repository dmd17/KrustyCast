# KrustyCast cluster member 2 for the E3 baseline (run.sh): the layout of
# krusty-load --cluster 3 --leader-cores 1,2,3,4,12
# --follower-cores 5,13,10,10/6,14,11,11, as a separate process.
ingress = "127.0.0.1:27002"
feed = "127.0.0.1:27900"       # krusty-load --feed-bind
interface = "127.0.0.1"
recovery = "127.0.0.1:27102"
stream_id = 1
spin = true
cores = [10, 5, 10, 10]      # ingress, core, egress, recovery
admin = "127.0.0.1:27202"
metrics = "/dev/shm/kb-krusty-node2.stats"

[limits]
outcome_ring = 64

[storage]
dir = "/var/tmp/krusty-aeron-bench/krusty-node2"
durability = "a"
snapshot_every = 1000000
core = 10

[cluster]
id = 2
members = ["1@127.0.0.1:27301", "2@127.0.0.1:27302", "3@127.0.0.1:27303"]
core = 13
