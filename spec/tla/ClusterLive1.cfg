\* Liveness under losses: 2 nodes, 1 client, 1 message, 2 terms, 1 loss. The log is finite but has room: with the filter copies are bounded (a term change, a loss, a resend crossing its outcome), without it they are not.
CONSTANTS
    Nodes = {n1, n2}
    Clients = {c1}
    MaxSeq = 1
    MaxTerm = 2
    MaxLog = 9
    MaxLoss = 1
    MaxCrash = 0
    MaxCopies = 6
    NoFilter = FALSE
    FilterIgnoresApplied = FALSE
    FilterIgnoresTerm = FALSE
    MineIgnoresTerm = FALSE
    SessionFilter = "none"
SPECIFICATION Spec
INVARIANTS
    OutcomesTrue
    CommittedAgree
    CopiesBounded
    ProposalsInLog
    ProposalsOrdered
PROPERTIES
    Liveness
CHECK_DEADLOCK FALSE
