\* Liveness under a crash: 2 nodes, 1 client, 1 message, 2 terms, 1 crash (the shell forgets its proposals and filter; the core is rebuilt).
CONSTANTS
    Nodes = {n1, n2}
    Clients = {c1}
    MaxSeq = 1
    MaxTerm = 2
    MaxLog = 9
    MaxLoss = 0
    MaxCrash = 1
    MaxCopies = 6
    NoDecidedAnswer = FALSE
    NoFilter = FALSE
    FilterIgnoresApplied = FALSE
    FilterIgnoresTerm = FALSE
    MineIgnoresTerm = FALSE
    SessionFilter = "none"
SPECIFICATION Spec
INVARIANTS
    OutcomesTrue
    CommittedAgree
    CopiesBounded
    ProposalsInLog
    ProposalsOrdered
PROPERTIES
    Liveness
CHECK_DEADLOCK FALSE
