\* Two messages from one client (gaps, NAKs, go-back-N, reordering): safety and CopiesBounded; 2 nodes, 2 terms, 1 loss. Large: > 223 M states, not exhausted in 90 min.
CONSTANTS
    Nodes = {n1, n2}
    Clients = {c1}
    MaxSeq = 2
    MaxTerm = 2
    MaxLog = 9
    MaxLoss = 1
    MaxCrash = 0
    MaxCopies = 6
    NoDecidedAnswer = FALSE
    NoFilter = FALSE
    FilterIgnoresApplied = FALSE
    FilterIgnoresTerm = FALSE
    MineIgnoresTerm = FALSE
    SessionFilter = "none"
SPECIFICATION Spec
INVARIANTS
    OutcomesTrue
    CommittedAgree
    CopiesBounded
    ProposalsInLog
    ProposalsOrdered
CHECK_DEADLOCK FALSE
