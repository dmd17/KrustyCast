\* CI: all behaviours of up to MaxSteps steps; 3 servers, 2 terms, logs of 2.
CONSTANTS
    Servers = {s1, s2, s3}
    Values = {v1}
    MaxTerm = 2
    MaxLog = 2
    MaxMsgs = 3
    WithRestart = TRUE
    WithStepDown = TRUE
    MaxSteps = 11
SPECIFICATION MCSpec
INVARIANTS
    TypeOK
    ElectionSafety
    LogMatching
    StateMachineSafety
    CommittedStable
    LeaderCompleteness
    QuorumLogInv
    MoreUpToDateCorrectInv
    CandidateTermNotInLogInv
    MonoTermInv
PROPERTIES
    LeaderAppendOnly
    NeverCommitEntryPrevTermsProp
    MonotonicMatchIndexProp
    CommittedLogAppendOnlyProp
    CommittedAppendOnly
CONSTRAINT
    MsgBound
    DepthBound
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
