\* RaftKC's recovery rule under power loss: 3 servers, 2 terms, logs of 1.
CONSTANTS
    Servers = {s1, s2, s3}
    Values = {v1}
    MaxTerm = 2
    MaxLog = 1
    MaxMsgs = 3
    WithRestart = FALSE
    WithStepDown = FALSE
    MaxPowerLoss = 1
    MaxSteps = 17
SPECIFICATION PSpec
INVARIANTS
    ElectionSafety
    LogMatching
    StateMachineSafety
    LeaderCompleteness
CONSTRAINT
    MsgBound
    DepthBound
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
