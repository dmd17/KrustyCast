\* CI: 3 servers, 2 terms, logs of up to 2 entries, 2 messages in flight, no restarts or step-downs.
CONSTANTS
    Servers = {s1, s2, s3}
    Values = {v1}
    MaxTerm = 2
    MaxLog = 2
    MaxMsgs = 2
    WithRestart = FALSE
    WithStepDown = FALSE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ElectionSafety
    LogMatching
    StateMachineSafety
    CommittedStable
    LeaderCompleteness
CONSTRAINT MsgBound
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
