\* Large: three terms, so a stale leader can outlive a newer leader's commit
\* (two terms cannot reach that). 3 servers, logs of up to 2 entries.
CONSTANTS
    Servers = {s1, s2, s3}
    Values = {v1}
    MaxTerm = 3
    MaxLog = 2
    MaxMsgs = 2
    WithRestart = FALSE
    WithStepDown = FALSE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ElectionSafety
    LogMatching
    StateMachineSafety
    CommittedStable
    LeaderCompleteness
PROPERTIES
    LeaderAppendOnly
CONSTRAINT MsgBound
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
