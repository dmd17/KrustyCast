\* Large: four terms, the fewest in which a leader can commit an old-term
\* entry by count and a later leader overwrite it (Figure 8; with three,
\* any log holding a later entry also holds the old one). One message in
\* flight and no client values keep it tractable: the scenario needs
\* neither. 3 servers, logs of up to 2 entries.
CONSTANTS
    Servers = {s1, s2, s3}
    Values = {}
    MaxTerm = 4
    MaxLog = 2
    MaxMsgs = 1
    WithRestart = FALSE
    WithStepDown = FALSE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ElectionSafety
    LogMatching
    StateMachineSafety
    CommittedStable
    LeaderCompleteness
PROPERTIES
    LeaderAppendOnly
CONSTRAINT MsgBound
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
