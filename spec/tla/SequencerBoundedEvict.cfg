\* CI: two clients, room for one session, so every newcomer evicts or gets
\* BUSY; restarts and stale messages in flight.
CONSTANTS
    Clients = {c1, c2}
    Keys = {k1}
    MaxSeq = 1
    MaxInc = 2
    MaxVer = 0
    MaxLog = 4
    MaxInFlight = 2
    MaxClients = 1
    Ring = 1
SPECIFICATION Spec
INVARIANTS
    AtMostOnce
    ConditionalAppend
    SessionFifo
    OutcomesTrue
    OutcomesStable
    Bounded
CONSTRAINT InFlightBound
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
