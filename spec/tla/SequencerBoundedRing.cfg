\* CI: one client whose window equals a ring of 1 (stop and wait): resends
\* beyond the ring must never get a wrong or missing-but-answered outcome.
CONSTANTS
    Clients = {c1}
    Keys = {k1}
    MaxSeq = 3
    MaxInc = 2
    MaxVer = 1
    MaxLog = 5
    MaxInFlight = 2
    MaxClients = 1
    Ring = 1
SPECIFICATION Spec
INVARIANTS
    AtMostOnce
    ConditionalAppend
    SessionFifo
    OutcomesTrue
    OutcomesStable
    Bounded
CONSTRAINT InFlightBound
CHECK_DEADLOCK FALSE
