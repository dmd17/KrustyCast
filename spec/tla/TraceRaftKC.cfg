\* Trace validation (see TraceRaftKC.tla and check-traces.sh). Deadlock
\* means the trace was rejected; a violation of Unfinished means accepted.
CONSTANTS
    Servers <- TraceServers
    Values = {}
    MaxTerm = 1000000
    MaxLog = 1000000
    MaxMsgs = 1000000
    WithRestart = TRUE
    WithStepDown = TRUE
INIT TraceInit
NEXT TraceNext
INVARIANT Unfinished
INVARIANT TraceSafety
